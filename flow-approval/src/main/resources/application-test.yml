spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:flow_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=KEY,VALUE
    username: sa
    password: ""
    druid:
      initial-size: 1
      min-idle: 1
      max-active: 10
      validation-query: SELECT 1
      test-while-idle: true
  sql:
    init:
      mode: always
      schema-locations: classpath:db/h2/schema.sql
  redis:
    host: localhost
    port: 6379

flow:
  token-store: memory
  repeal-keep-record: true
  demo:
    enabled: false
  jwt:
    secret: flow-approval-test-secret
    expire-minutes: 60
  security:
    password-salt: flow-approval

logging:
  level:
    root: WARN
    com.joinsoft: INFO
